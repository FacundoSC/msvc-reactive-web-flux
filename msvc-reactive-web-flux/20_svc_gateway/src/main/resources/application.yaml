eureka:
  client:
      service-url:
        defaultZone: http://localhost:8761/eureka
server:
    port: 7001
spring:
    application:
      name: svc_gateway
    cloud:
      gateway:
        routes:
          - id: msvc_crud_productos_reactivo_tienda_2
            uri: lb://msvc_crud_productos_reactivo_tienda_2 #http://localhost:8080
            predicates:
              - Path=/api/v1/products/**
            filters:
              - RewritePath=/api/v1/products/*, /
            default-filters:
              - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            globalcors:
              corsConfigurations:
                '[/**]':
                  allowedOrigins: "*"
                  allowedMethods: "*"
                  allowedHeaders: "*"

